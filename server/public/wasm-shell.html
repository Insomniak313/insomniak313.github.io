<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>reVC — Web (WASM)</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f16;
        --panel: rgba(18, 24, 36, 0.7);
        --text: #e7ecf5;
        --muted: rgba(231, 236, 245, 0.7);
        --border: rgba(231, 236, 245, 0.18);
        --accent: #7dd3fc;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
      }

      #app {
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(to bottom, rgba(18, 24, 36, 0.8), rgba(18, 24, 36, 0.25));
        backdrop-filter: blur(10px);
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        white-space: nowrap;
      }

      .brand strong {
        letter-spacing: 0.2px;
      }

      .brand span {
        color: var(--muted);
        font-size: 12px;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .controls label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        user-select: none;
      }

      button {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(18, 24, 36, 0.7);
        color: var(--text);
        padding: 8px 10px;
        border-radius: 10px;
        font-size: 12px;
        cursor: pointer;
      }

      button:hover {
        border-color: rgba(125, 211, 252, 0.45);
      }

      main {
        position: relative;
        min-height: 0;
      }

      #canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
        outline: none;
      }

      #overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        pointer-events: none;
      }

      .panel {
        width: min(720px, 100%);
        border: 1px solid var(--border);
        background: var(--panel);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 14px;
        pointer-events: auto;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .status {
        font-size: 13px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      progress {
        width: 100%;
        height: 12px;
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.35);
      }

      progress::-webkit-progress-bar {
        background: rgba(0, 0, 0, 0.35);
      }

      progress::-webkit-progress-value {
        background: linear-gradient(90deg, rgba(125, 211, 252, 0.9), rgba(167, 243, 208, 0.9));
      }

      #log {
        width: 100%;
        height: 160px;
        margin-top: 10px;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New",
          monospace;
        font-size: 12px;
        color: rgba(231, 236, 245, 0.9);
        background: rgba(0, 0, 0, 0.45);
        resize: vertical;
        box-sizing: border-box;
        outline: none;
      }

      .hint {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.35;
      }

      .hint code {
        color: var(--text);
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <header>
        <div class="brand">
          <strong>reVC</strong>
          <span>Web (WASM)</span>
        </div>
        <div class="controls">
          <label><input type="checkbox" id="resize" /> Redimensionner</label>
          <label><input type="checkbox" id="pointerLock" checked /> Verrouiller la souris</label>
          <button id="btnFullscreen" type="button">Plein écran</button>
          <button id="btnReload" type="button">Recharger</button>
        </div>
      </header>

      <main>
        <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
        <div id="overlay">
          <div class="panel" id="panel">
            <div class="row">
              <div class="status" id="status">Téléchargement…</div>
              <div class="status" id="details"></div>
            </div>
            <progress id="progress" max="100" value="0"></progress>
            <textarea id="log" rows="8" readonly></textarea>
            <div class="hint">
              - Le fichier <code>gta3.img</code> (~500 MB) est téléchargé automatiquement depuis Vercel Blob au premier lancement.<br />
              - Multijoueur navigateur: WebSocket sur <code>/ws</code> (même origine).
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      const statusElement = document.getElementById("status");
      const detailsElement = document.getElementById("details");
      const progressElement = document.getElementById("progress");
      const logElement = document.getElementById("log");
      const panelElement = document.getElementById("panel");
      const canvasElement = document.getElementById("canvas");

      const btnFullscreen = document.getElementById("btnFullscreen");
      const btnReload = document.getElementById("btnReload");

      btnReload.addEventListener("click", () => window.location.reload());
      btnFullscreen.addEventListener("click", () => {
        const wantsPointerLock = document.getElementById("pointerLock").checked;
        const wantsResize = document.getElementById("resize").checked;
        if (typeof Module?.requestFullscreen === "function") {
          Module.requestFullscreen(wantsPointerLock, wantsResize);
        }
      });

      function appendLog(line) {
        if (!logElement) return;
        logElement.value += line + "\n";
        logElement.scrollTop = logElement.scrollHeight;
      }

      function setStatus(text) {
        statusElement.textContent = text || "";
      }

      function showPanel() {
        panelElement.classList.remove("hidden");
      }

      let hasHiddenPanel = false;
      function hidePanelOnce() {
        if (hasHiddenPanel) return;
        hasHiddenPanel = true;
        panelElement.classList.add("hidden");
      }

      // Module est utilisé par le runtime Emscripten.
      // eslint-disable-next-line no-var
      var Module = {
        canvas: canvasElement,
        preRun: [
          async () => {
            // Les assets sont préchargés sous /gamefiles (voir --preload-file).
            // Beaucoup de chemins du jeu sont relatifs (models/neo/TEXT) et certains
            // peuvent être absolus (/TEXT) ou utiliser des backslashes (\TEXT\).
            // On se place donc dans /gamefiles et on crée des symlinks de compat.
            if (typeof FS === "undefined") return;
            
            try {
              const hasGamefiles = FS.analyzePath("/gamefiles")?.exists;
              if (!hasGamefiles) {
                FS.mkdir("/gamefiles");
              }

              // Créer le dossier models s'il n'existe pas
              if (!FS.analyzePath("/gamefiles/models")?.exists) {
                FS.mkdir("/gamefiles/models");
              }

              // Télécharger gta3.img depuis le blob Vercel
              const gta3ImgPath = "/gamefiles/models/gta3.img";
              if (!FS.analyzePath(gta3ImgPath)?.exists) {
                Module.setStatus("Téléchargement de gta3.img...");
                appendLog("📥 Téléchargement de gta3.img depuis Vercel Blob...");
                
                try {
                  const blobUrl = "https://3px5m57ackbno8gi.public.blob.vercel-storage.com/gta3.img";
                  const response = await fetch(blobUrl);
                  
                  if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                  }

                  const totalBytes = parseInt(response.headers.get('content-length') || '0');
                  const reader = response.body.getReader();
                  const chunks = [];
                  let receivedBytes = 0;
                  let lastProgressUpdate = 0;

                  while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    chunks.push(value);
                    receivedBytes += value.length;

                    // Mettre à jour la progression toutes les 500ms pour ne pas surcharger l'UI
                    const now = Date.now();
                    if (now - lastProgressUpdate > 500) {
                      const percent = totalBytes > 0 ? Math.round((receivedBytes / totalBytes) * 100) : 0;
                      const mb = (receivedBytes / 1024 / 1024).toFixed(1);
                      const totalMb = (totalBytes / 1024 / 1024).toFixed(1);
                      Module.setStatus(`Téléchargement gta3.img (${mb}/${totalMb} MB)`);
                      progressElement.value = percent;
                      detailsElement.textContent = `${percent}%`;
                      lastProgressUpdate = now;
                    }
                  }

                  // Concaténer tous les chunks
                  const blob = new Uint8Array(receivedBytes);
                  let position = 0;
                  for (const chunk of chunks) {
                    blob.set(chunk, position);
                    position += chunk.length;
                  }

                  // Écrire dans le système de fichiers virtuel
                  FS.writeFile(gta3ImgPath, blob);
                  
                  const sizeMB = (receivedBytes / 1024 / 1024).toFixed(1);
                  appendLog(`✓ gta3.img téléchargé avec succès (${sizeMB} MB)`);
                  Module.setStatus("Préparation des assets...");
                } catch (err) {
                  appendLog(`❌ Erreur lors du téléchargement de gta3.img: ${err.message}`);
                  Module.setStatus("Erreur de téléchargement");
                  throw err;
                }
              } else {
                appendLog("✓ gta3.img déjà présent");
              }

              try {
                FS.chdir("/gamefiles");
              } catch (e) {
                // ignore
              }

              const maybeLink = (target, linkPath) => {
                try {
                  if (FS.analyzePath(linkPath)?.exists) return;
                  if (!FS.analyzePath(target)?.exists) return;
                  FS.symlink(target, linkPath);
                } catch (e) {
                  // ignore
                }
              };

              maybeLink("/gamefiles/models", "/models");
              maybeLink("/gamefiles/neo", "/neo");
              maybeLink("/gamefiles/TEXT", "/TEXT");
              maybeLink("/gamefiles/TEXT", "/text");
              maybeLink("/gamefiles/data", "/data");
            } catch (e) {
              appendLog(`[preRun error] ${e.message || e}`);
              throw e;
            }
          },
        ],
        print: (...args) => {
          const line = args.join(" ");
          console.log(...args);
          appendLog(line);
        },
        printErr: (...args) => {
          const line = args.join(" ");
          console.error(...args);
          appendLog("[err] " + line);
        },
        setStatus: (text) => {
          // Format courant: "Preparing... (1/10)" / "Downloading..." / etc.
          if (!text) {
            setStatus("");
            return;
          }

          const match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          if (match) {
            const label = match[1].trim();
            const current = Number(match[2]);
            const total = Number(match[4]);
            const pct = total > 0 ? Math.min(100, Math.round((current / total) * 100)) : 0;
            progressElement.value = pct;
            detailsElement.textContent = `${pct}%`;
            setStatus(label);
          } else {
            setStatus(text);
            detailsElement.textContent = "";
          }
        },
        monitorRunDependencies: (left) => {
          Module.totalDependencies = Math.max(Module.totalDependencies || 0, left);
          if (left) {
            Module.setStatus(`Préparation… (${Module.totalDependencies - left}/${Module.totalDependencies})`);
          } else {
            progressElement.value = 100;
            // Important: ne pas masquer le panneau ici.
            // Si le runtime abort juste après (WebGL/JS), on éviter un écran noir “silencieux”.
            Module.setStatus("Démarrage…");
          }
        },
        onAbort: (what) => {
          showPanel();
          Module.setStatus("❌ Erreur fatale (abort)");
          const msg = what ? String(what) : "unknown";
          appendLog("[ABORT] " + msg);
          // Capturer la stack trace si disponible
          if (typeof stackTrace !== 'undefined' && stackTrace) {
            appendLog(stackTrace());
          }
          // Afficher des informations utiles pour le debugging
          appendLog("\n--- Informations de debugging ---");
          appendLog("User Agent: " + navigator.userAgent);
          appendLog("Mémoire JS: " + (performance?.memory ? 
            `${(performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(1)}MB / ${(performance.memory.jsHeapSizeLimit / 1024 / 1024).toFixed(1)}MB` : 
            "N/A"));
        },
        // Si le runtime démarre vraiment, postRun s’exécute (contrairement à monitorRunDependencies).
        postRun: [
          () => {
            Module.setStatus("Prêt.");
            requestAnimationFrame(() => hidePanelOnce());
          },
        ],
      };

      window.addEventListener("error", (e) => {
        showPanel();
        Module.setStatus("❌ Crash détecté");
        const msg = e?.message || String(e);
        const file = e?.filename ? ` @ ${e.filename}:${e.lineno}:${e.colno}` : '';
        appendLog(`[CRASH] ${msg}${file}`);
        if (e?.error?.stack) {
          appendLog(e.error.stack);
        }
      });

      window.addEventListener("unhandledrejection", (e) => {
        showPanel();
        Module.setStatus("❌ Promise rejetée");
        const reason = e?.reason;
        appendLog("[unhandledrejection] " + (reason ? String(reason) : "unknown"));
        if (reason?.stack) {
          appendLog(reason.stack);
        }
      });

      // Empêche la perte de contexte WebGL de casser silencieusement.
      canvasElement.addEventListener(
        "webglcontextlost",
        (e) => {
          e.preventDefault();
          showPanel();
          Module.setStatus("❌ Contexte WebGL perdu");
          appendLog("[WebGL] Contexte perdu - la carte graphique a rencontré un problème");
          alert("Contexte WebGL perdu. Recharge la page.");
        },
        false
      );
    </script>

    {{{ SCRIPT }}}
  </body>
</html>
