<!doctypehtml><html lang=fr><head><meta charset=utf-8><meta content="text/html; charset=utf-8"http-equiv=Content-Type><meta content="width=device-width,initial-scale=1,viewport-fit=cover"name=viewport><title>reVC — Web (WASM)</title><style>:root{color-scheme:dark;--bg:#0b0f16;--panel:rgba(18, 24, 36, 0.7);--text:#e7ecf5;--muted:rgba(231, 236, 245, 0.7);--border:rgba(231, 236, 245, 0.18);--accent:#7dd3fc}body,html{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,"Apple Color Emoji","Segoe UI Emoji"}#app{height:100%;display:grid;grid-template-rows:auto 1fr}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);background:linear-gradient(to bottom,rgba(18,24,36,.8),rgba(18,24,36,.25));backdrop-filter:blur(10px)}.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}.brand strong{letter-spacing:.2px}.brand span{color:var(--muted);font-size:12px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.controls label{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);user-select:none}button{appearance:none;border:1px solid var(--border);background:rgba(18,24,36,.7);color:var(--text);padding:8px 10px;border-radius:10px;font-size:12px;cursor:pointer}button:hover{border-color:rgba(125,211,252,.45)}main{position:relative;min-height:0}#canvas{width:100%;height:100%;display:block;background:#000;outline:0}#overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;pointer-events:none}.panel{width:min(720px,100%);border:1px solid var(--border);background:var(--panel);backdrop-filter:blur(10px);border-radius:16px;padding:14px;pointer-events:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.status{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}progress{width:100%;height:12px;border-radius:999px;overflow:hidden;border:1px solid var(--border);background:rgba(0,0,0,.35)}progress::-webkit-progress-bar{background:rgba(0,0,0,.35)}progress::-webkit-progress-value{background:linear-gradient(90deg,rgba(125,211,252,.9),rgba(167,243,208,.9))}#log{width:100%;height:160px;margin-top:10px;border:1px solid var(--border);border-radius:12px;padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:12px;color:rgba(231,236,245,.9);background:rgba(0,0,0,.45);resize:vertical;box-sizing:border-box;outline:0}.hint{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.35}.hint code{color:var(--text)}.hidden{display:none!important}</style></head><body><div id=app><header><div class=brand><strong>reVC</strong> <span>Web (WASM)</span></div><div class=controls><label><input id=resize type=checkbox> Redimensionner</label> <label><input id=pointerLock type=checkbox checked> Verrouiller la souris</label> <button id=btnFullscreen type=button>Plein écran</button> <button id=btnReload type=button>Recharger</button></div></header><main><canvas id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas><div id=overlay><div class=panel id=panel><div class=row><div class=status id=status>Téléchargement…</div><div class=status id=details></div></div><progress id=progress max=100 value=0></progress><textarea id=log readonly rows=8></textarea><div class=hint>- Ce build est servi depuis <code>/game/</code> via le serveur Node (<code>server/</code>).<br>- Multijoueur navigateur: WebSocket sur <code>/ws</code> (même origine).</div></div></div></main></div><script>const statusElement=document.getElementById("status"),detailsElement=document.getElementById("details"),progressElement=document.getElementById("progress"),logElement=document.getElementById("log"),panelElement=document.getElementById("panel"),canvasElement=document.getElementById("canvas"),btnFullscreen=document.getElementById("btnFullscreen"),btnReload=document.getElementById("btnReload");function appendLog(e){logElement&&(logElement.value+=e+"\n",logElement.scrollTop=logElement.scrollHeight)}function setStatus(e){statusElement.textContent=e||""}btnReload.addEventListener("click",(()=>window.location.reload())),btnFullscreen.addEventListener("click",(()=>{const e=document.getElementById("pointerLock").checked,t=document.getElementById("resize").checked;"function"==typeof Module?.requestFullscreen&&Module.requestFullscreen(e,t)}));var Module={canvas:canvasElement,print:(...e)=>{const t=e.join(" ");console.log(...e),appendLog(t)},printErr:(...e)=>{const t=e.join(" ");console.error(...e),appendLog("[err] "+t)},setStatus:e=>{if(!e)return void setStatus("");const t=e.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);if(t){const e=t[1].trim(),n=Number(t[2]),l=Number(t[4]),o=l>0?Math.min(100,Math.round(n/l*100)):0;progressElement.value=o,detailsElement.textContent=`${o}%`,setStatus(e)}else setStatus(e),detailsElement.textContent=""},monitorRunDependencies:e=>{Module.totalDependencies=Math.max(Module.totalDependencies||0,e),e?Module.setStatus(`Préparation… (${Module.totalDependencies-e}/${Module.totalDependencies})`):(Module.setStatus("Prêt."),progressElement.value=100,panelElement.classList.add("hidden"))}};window.addEventListener("error",(e=>{Module.setStatus("Exception (voir console)"),appendLog("[window.onerror] "+(e?.message||String(e)))})),canvasElement.addEventListener("webglcontextlost",(e=>{e.preventDefault(),alert("Contexte WebGL perdu. Recharge la page.")}),!1)</script><script async src=index.js></script></body></html>
